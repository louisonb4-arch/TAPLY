<a class="skip-link" href="#view">Aller au contenu</a>

<div class="shell">
  <!-- Barre latérale (desktop) -->
  <aside class="side" aria-label="Navigation de l'espace commerçant">
    <a class="side__logo logo" href="#/accueil" aria-label="Taply — accueil du tableau de bord"><img class="logo__asset logo__asset--dark" src="../images/taply-wordmark-noir.png" width="1697" height="644" alt="" aria-hidden="true"><img class="logo__asset logo__asset--light" src="../images/taply-wordmark-blanc.png" width="1697" height="644" alt="" aria-hidden="true"></a>

    <a class="merchant" href="#/parametres">
      <span class="merchant__logo" data-merchant-logo></span>
      <span class="merchant__txt"><strong data-merchant-name></strong><small data-merchant-city></small></span>
    </a>

    <nav class="side__nav">
      <a href="#/accueil" data-nav="accueil"><svg aria-hidden="true"><use href="#d-home"/></svg>Accueil</a>
      <a href="#/demarrage" data-nav="demarrage"><svg aria-hidden="true"><use href="#d-store"/></svg>Créer ma carte</a>
      <a href="#/carte" data-nav="carte"><svg aria-hidden="true"><use href="#d-card"/></svg>Ma carte</a>
      <a href="#/scanner" data-nav="scanner"><svg aria-hidden="true"><use href="#d-camera"/></svg>Scanner</a>
      <a href="#/clients" data-nav="clients"><svg aria-hidden="true"><use href="#d-users"/></svg>Clients</a>
      <a href="#/recompenses" data-nav="recompenses"><svg aria-hidden="true"><use href="#d-gift"/></svg>Récompenses</a>
      <a href="#/supports" data-nav="supports"><svg aria-hidden="true"><use href="#d-nfc"/></svg>QR &amp; NFC</a>
      <a href="#/abonnement" data-nav="abonnement"><svg aria-hidden="true"><use href="#d-wallet"/></svg>Abonnement</a>
      <a href="#/notifications" data-nav="notifications"><svg aria-hidden="true"><use href="#d-bell"/></svg>Notifications</a>
      <a href="#/parametres" data-nav="parametres"><svg aria-hidden="true"><use href="#d-gear"/></svg>Paramètres</a>
    </nav>

    <div class="side__foot">
      <div class="nfc-mini">
        <span class="nfc-mini__icon"><svg aria-hidden="true"><use href="#d-nfc"/></svg></span>
        <span><strong>Présentoir NFC</strong><small><i class="dot" aria-hidden="true"></i><span data-nfc-status></span></small></span>
      </div>
      <a class="side__out" href="../connexion.html"><svg aria-hidden="true"><use href="#d-logout"/></svg>Se déconnecter</a>
    </div>
  </aside>

  <div class="main">
    <!-- En-tête (mobile : logo + actions ; desktop : actions) -->
    <header class="top">
      <a class="top__logo logo" href="#/accueil" aria-label="Taply — accueil du tableau de bord"><img class="logo__asset logo__asset--dark" src="../images/taply-wordmark-noir.png" width="1697" height="644" alt="" aria-hidden="true"><img class="logo__asset logo__asset--light" src="../images/taply-wordmark-blanc.png" width="1697" height="644" alt="" aria-hidden="true"></a>
      <p class="top__crumb" data-crumb></p>
      <div class="top__actions">
        <a class="btn-chip top__site" href="../index.html" target="_blank" rel="noopener">Voir le site</a>
        <a class="icon-btn" href="#/notifications" aria-label="Envoyer une notification"><svg aria-hidden="true"><use href="#d-bell"/></svg><i class="icon-btn__dot" aria-hidden="true"></i></a>
        <a class="icon-btn top__gear" href="#/parametres" aria-label="Paramètres"><svg aria-hidden="true"><use href="#d-gear"/></svg></a>
        <a class="avatar avatar--brand top__me" href="#/parametres" aria-label="Mon établissement" data-merchant-initial></a>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
  </div>
</div>

<!-- Barre d'onglets (mobile) -->
<nav class="tabbar" aria-label="Navigation principale">
  <a href="#/accueil" data-nav="accueil"><svg aria-hidden="true"><use href="#d-home"/></svg><span>Accueil</span></a>
  <a href="#/scanner" data-nav="scanner"><svg aria-hidden="true"><use href="#d-camera"/></svg><span>Scanner</span></a>
  <a href="#/carte" data-nav="carte"><svg aria-hidden="true"><use href="#d-card"/></svg><span>Ma carte</span></a>
  <a href="#/clients" data-nav="clients"><svg aria-hidden="true"><use href="#d-users"/></svg><span>Clients</span></a>
  <a href="#/parametres" data-nav="parametres notifications supports abonnement recompenses demarrage"><svg aria-hidden="true"><use href="#d-more"/></svg><span>Plus</span></a>
</nav>

<!-- Confirmation (modale) -->
<dialog class="sheet" data-sheet aria-labelledby="sheet-title">
  <form method="dialog" class="sheet__inner">
    <h2 id="sheet-title" data-sheet-title></h2>
    <p data-sheet-text></p>
    <div class="sheet__actions">
      <button class="btn btn--ghost" value="cancel">Annuler</button>
      <button class="btn btn--brand" value="ok" data-sheet-ok></button>
    </div>
  </form>
</dialog>

<div class="toasts" role="status" aria-live="polite" data-toasts></div>
</body>
</html>
